# arduino-cli project file: https://arduino.github.io/arduino-cli/latest/sketch-project-file/
#
# Day to day:  arduino-cli compile            -> uses default_fqbn + libraries installed on this machine
# Reproducible: arduino-cli compile --profile heltec_v3
#              -> downloads exactly the pinned core and library versions (used by CI and releases)
#
# No default_port on purpose: with one set, arduino-cli probes the board on every compile
# and fails when it is unplugged. The port lives in the /flash skill instead.

profiles:
  heltec_v3:
    fqbn: esp32:esp32:heltec_wifi_lora_32_V3
    platforms:
      - platform: esp32:esp32 (3.3.7)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - IRremoteESP8266 (2.9.0)
      - ESP8266 and ESP32 OLED driver for SSD1306 displays (4.6.2)

default_fqbn: esp32:esp32:heltec_wifi_lora_32_V3
