# Continuous integration: every push and pull request
#   1. builds the firmware with the exact core and library versions pinned in sketch.yaml,
#      and fails on any compiler warning in the project's own files;
#   2. runs the host tests of the .ir parser under AddressSanitizer and UBSan;
#   3. runs cppcheck with the same options as the /lint command.
#
# The repository is checked out into a folder named "securitea": the Arduino builder requires
# the main file (securitea.ino) to carry the folder's name, and GitHub's default folder name is
# the repository name with its capital letters.
name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Firmware build (heltec_v3 profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: securitea

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cache the ESP32 core and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: arduino-${{ runner.os }}-${{ hashFiles('securitea/sketch.yaml') }}

      - name: Compile
        working-directory: securitea
        run: |
          arduino-cli compile --profile heltec_v3 --warnings default --build-path build . 2>&1 | tee build.log
          # The project rule is zero warnings at the default level. Only our own files count:
          # the ESP32 core and the libraries are not ours to fix.
          if grep "warning:" build.log | grep -v "/.arduino15/" | grep -q .; then
            echo "::error::compiler warnings in project files are not allowed"
            grep "warning:" build.log | grep -v "/.arduino15/"
            exit 1
          fi
          grep -E "Sketch uses|Global variables" build.log

      - name: Keep the binaries
        uses: actions/upload-artifact@v4
        with:
          name: securitea-firmware
          path: |
            securitea/build/securitea.ino.bin
            securitea/build/securitea.ino.bootloader.bin
            securitea/build/securitea.ino.partitions.bin
          if-no-files-found: error

  host-tests:
    name: Host tests (ir_file parser, ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: securitea
      - name: Build and run
        run: make -C securitea/tests/host

  lint:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: securitea
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run
        working-directory: securitea
        run: |
          cppcheck --language=c++ --std=c++17 --quiet --force --inline-suppr \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unusedFunction \
            --suppress=unusedStructMember --error-exitcode=1 \
            --template='{file}:{line}: {severity} [{id}] {message}' \
            -DARDUINO=10819 -DESP32 -DARDUINO_ARCH_ESP32 -DCORE_DEBUG_LEVEL=0 \
            -I . *.ino *.h *.cpp
